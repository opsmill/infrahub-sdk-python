---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: "CI"
on:
  pull_request:
  push:
    branches:
      - develop
      - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INFRAHUB_DB_USERNAME: neo4j
  INFRAHUB_DB_PASSWORD: admin
  INFRAHUB_DB_ADDRESS: localhost
  INFRAHUB_DB_PORT: 7687
  INFRAHUB_DB_PROTOCOL: bolt
  INFRAHUB_BROKER_ADDRESS: message-queue
  INFRAHUB_LOG_LEVEL: CRITICAL
  INFRAHUB_IMAGE_NAME: "opsmill/infrahub"
  INFRAHUB_IMAGE_VER: "local"
  PYTEST_XDIST_WORKER_COUNT: 4
  INFRAHUB_TEST_IN_DOCKER: 1
  VALE_VERSION: "3.7.1"
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  METRICS_ENDPOINT: ${{ secrets.METRICS_ENDPOINT }}

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  # ------------------------------------------ Check Files Changes  ------------------------------------------
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      documentation_generated: ${{ steps.changes.outputs.documentation_generated_all }}
      helm: ${{ steps.changes.outputs.helm_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      uv_files: ${{ steps.changes.outputs.uv_files }}
      github_workflows: ${{ steps.changes.outputs.github_workflows }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

 # ------------------------------------------ All Linter  ------------------------------------------

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Setup environment"
        run: "pip install yamllint==1.35.1"
      - name: "Linting: yamllint"
        run: "yamllint -s ."

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed", "prepare-environment"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: "Linting: ruff check"
        run: "uv run ruff check ."
      - name: "Linting: ruff format"
        run: "uv run ruff format --check --diff ."
      - name: "Linting: ty check"
        run: "uv run ty check ."


  markdown-lint:
    if: |
      needs.files-changed.outputs.documentation == 'true' ||
      needs.files-changed.outputs.github_workflows == 'true'
    needs: ["files-changed", "prepare-environment"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: "Linting: rumdl"
        run: "uvx rumdl@0.2.28 check ."

  action-lint:
    if: needs.files-changed.outputs.github_workflows == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
        env:
          SHELLCHECK_OPTS: --exclude=SC2086 --exclude=SC2046 --exclude=SC2004 --exclude=SC2129

  uv-lock-check:
    if: |
      needs.files-changed.outputs.uv_files == 'true' ||
      needs.files-changed.outputs.github_workflows == 'true'
    needs:
      - files-changed
      - prepare-environment
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: "Validate pyproject.toml and consistency with uv.lock"
        run: uv lock --locked --offline

  documentation:
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: "Install dependencies"
        run: npm install
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: "Build docs website"
        run: "uv run invoke docs"

  validate-generated-documentation:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.files-changed.outputs.python == 'true' || needs.files-changed.outputs.documentation_generated == 'true')
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: "Install npm dependencies"
        run: npm install
        working-directory: ./docs
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Docs unit tests
        run: npx --no-install vitest run
        working-directory: ./docs
      - name: Validate generated documentation
        run: uv run invoke docs-validate
  validate-documentation-style:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["files-changed", "yaml-lint", "python-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true

      # The official GitHub Action for Vale doesn't work, installing manually instead:
      # https://github.com/errata-ai/vale-action/issues/103
      # cf -> https://github.com/nf-core/website/pull/3509
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
        env:
          VALE_VERSION: ${{ env.VALE_VERSION }}
      - name: "Validate documentation style"
        run: ./vale $(find ./docs -type f \( -name "*.mdx" -o -name "*.md" \) )

  unit-tests:
    env:
      # workaround for Rich table column width
      COLUMNS: 140
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.python == 'true'
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Mypy Tests
        run: uv run mypy --show-error-codes infrahub_sdk/
      - name: Unit Tests
        run: uv run pytest --cov infrahub_sdk tests/unit/
      - name: "Upload coverage to Codecov"
        run: |
          uv run codecov --flags python-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The pytest-cov plugin doesn't quite work with content that is
      # auto-imported by our own infrahub pytest plugin, this workaround
      # reports the missing lines
      - name: "Report coverage for pytest-plugin"
        if: matrix.python-version == '3.12'
        run: |
          uv run coverage run --source=infrahub_sdk -m pytest tests/unit/pytest_plugin
          uv run coverage report -m
          uv run coverage xml
          uv run codecov --flags python-filler-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ------------------------------------------ Dependency Bounds  ------------------------------------------
  # `unit-tests` above installs exactly what uv.lock pins, so it never exercises the version ranges
  # declared in pyproject.toml. The two jobs below cover the parts of that gap that a pull request
  # can be held to. Upper bounds are deliberately absent: any upstream release could turn such a job
  # red without a line of our code changing, which is not something a PR should be blocked on.

  # Re-resolves at the declared lower bounds. Safe as a required check because the result only moves
  # when pyproject.toml does; a floor is a fixed point, unlike a ceiling.
  #
  # What this does not reach: where a development dependency constrains a package more tightly than
  # we do, it wins, so pytest, httpx, graphql-core, pydantic, anyio and typing-extensions all resolve
  # above their declared floors here. Those need an environment with no development dependencies.
  dependency-lower-bounds:
    env:
      # workaround for Rich table column width
      COLUMNS: 140
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.python == 'true'
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      # Pinned to the oldest interpreter we support, because that is where floor-era wheels exist.
      # The resolver selects the same floors on every supported version, but installing them does
      # not work everywhere: pyarrow 14, pyyaml 6.0 and ujson 5.0 ship no wheels past cp312, so on
      # 3.13 or 3.14 this job would compile them from source and fail for reasons unrelated to our
      # code. A matrix would therefore add nothing. A floor states the oldest version we have
      # validated, not one installable on every interpreter; a newer interpreter simply resolves
      # higher, which `install-matrix` below confirms still works.
      # Bump this when the oldest supported version changes. If it goes stale the job fails loudly,
      # because `requires-python` will reject the interpreter.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
          python-version: "3.10"
      # Rewrites uv.lock in the checkout, which is discarded with the runner.
      - name: "Re-resolve at the declared lower bounds"
        run: uv lock --resolution lowest-direct
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      # Printed so a failure can be read against the versions that produced it.
      - name: "Report the resolved versions"
        run: uv pip list
      - name: Unit Tests
        run: uv run pytest --cov infrahub_sdk tests/unit/

  # Confirms the published package installs and imports on every supported interpreter, resolving
  # fresh rather than from uv.lock. `unit-tests` proves the pinned set works; this proves that what
  # a user actually gets from a plain install does too.
  install-matrix:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.python == 'true'
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          # hatch-vcs derives the version from git tags, and a shallow clone has none.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
          python-version: ${{ matrix.python-version }}
      - name: "Build the wheel"
        run: uv build --wheel --out-dir dist/
      # Deliberately not `uv sync`: installing the built wheel with a fresh resolution is what a
      # user experiences, and it is the only thing here that does not consult uv.lock.
      - name: "Install the wheel with every extra"
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-install
          uv pip install --python .venv-install "$(echo dist/*.whl)[all]"
      - name: "Report the resolved versions"
        run: uv pip list --python .venv-install
      # Importing every module catches a dependency that resolves but cannot be imported, which is
      # how `infrahub_sdk.template` was broken on a plain install before it was declared core.
      - name: "Import every shipped module"
        run: |
          .venv-install/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import infrahub_sdk

          failures = []
          for module in pkgutil.walk_packages(infrahub_sdk.__path__, "infrahub_sdk."):
              try:
                  importlib.import_module(module.name)
              except BaseException as exc:  # noqa: BLE001
                  failures.append(f"{module.name}: {type(exc).__name__}: {exc}")
          for failure in failures:
              print(f"FAIL {failure}")
          print(f"{len(failures)} module(s) failed to import")
          sys.exit(1 if failures else 0)
          PY
      - name: "Run the CLI"
        run: |
          .venv-install/bin/infrahubctl --help
          .venv-install/bin/infrahubctl schema --help
          .venv-install/bin/infrahubctl branch --help

  # ------------------------------------------ Integration Tests  ------------------------------------------
  integration-tests-latest-infrahub:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.python == 'true'
    needs: ["prepare-environment", "files-changed", "yaml-lint", "python-lint", "unit-tests"]
    runs-on:
      group: "huge-runners"
    timeout-minutes: 40
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_NAME}/_temp" >> $GITHUB_ENV
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ needs.prepare-environment.outputs.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Integration Tests
        run: uv run pytest --cov infrahub_sdk tests/integration/
      - name: "Upload coverage to Codecov"
        run: |
          uv run codecov --flags integration-tests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # NOTE: Disabling this test for now because it's expected that we can't start the latest version of infrahub
