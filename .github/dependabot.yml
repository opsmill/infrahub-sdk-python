---
# yamllint disable rule:truthy
version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: stable
    labels:
      - "type/housekeeping"

  # Maintain infrahub-testcontainers dependency
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: stable
    labels:
      - "type/housekeeping"
    allow:
      - dependency-name: "infrahub-testcontainers"
